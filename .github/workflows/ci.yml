name: CI

on:
  push:
    branches: [arl]
  pull_request:
    branches: [arl]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run pack:arl
      - uses: actions/upload-artifact@v4
        with:
          name: auto-research-loop
          path: artifacts/arl-*
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: [test_a0.ts, test_tester_facility.ts, test_setup.ts, test_validation.ts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test -- tests/${{ matrix.file }}
