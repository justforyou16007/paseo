name: ARIS Tester Image

# Rebuilds whenever the tester manual changes: deploy refuses an image whose
# /opt/aris/TESTER_AGENT.md is not the research side's version, so every commit
# that edits the manual needs an image built from that same commit.
on:
  push:
    branches: [paseo-aris]
    paths:
      - packages/Auto-claude-code-research-in-sleep/docker/tester-base/**
      - packages/Auto-claude-code-research-in-sleep/templates/tester-agent-bundle/**
      - .github/workflows/aris-tester-image.yml
  workflow_dispatch:

concurrency:
  group: aris-tester-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - id: values
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/aris-tester-base"
          {
            echo "tags<<EOF"
            echo "${image}:sha-${GITHUB_SHA::12}"
            echo "${image}:ubuntu22.04"
            echo "${image}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/Auto-claude-code-research-in-sleep/docker/tester-base/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.values.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          provenance: false
          cache-from: type=gha,scope=aris-tester
          cache-to: type=gha,scope=aris-tester,mode=max
